<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · Node not found · Amine Guizani</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/MedAminePortfolio/favicon.svg" />
    <style>
      :root { --bg: #0b0a0c; --text: #f2ede6; --muted: #9a948c; --ember: #ff6a2b; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        background: radial-gradient(60% 60% at 50% 50%, #170d09, var(--bg) 70%); color: var(--text);
        font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 640px; width: 100%; }
      pre { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--muted); white-space: pre-wrap; margin: 0 0 28px; }
      .err { color: var(--ember); }
      h1 { font-size: clamp(72px, 18vw, 180px); line-height: 0.85; letter-spacing: -0.06em; margin: 0 0 18px; font-weight: 800; }
      p { color: var(--muted); font-size: 18px; margin: 0 0 30px; }
      a { display: inline-block; padding: 14px 22px; border-radius: 999px; background: var(--ember); color: #140904; text-decoration: none; font-weight: 600; }
      a:hover { box-shadow: 0 0 40px rgba(255, 106, 43, 0.55); }
      .caret { display: inline-block; width: 0.55em; height: 1em; background: var(--ember); vertical-align: -0.12em; animation: b 1s steps(1) infinite; }
      @keyframes b { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <pre>&gt; navigate({"to": location.pathname})
<span class="err">✕ NodeNotFound: this edge doesn't lead anywhere</span>
&gt; fallback → home<span class="caret"></span></pre>
      <h1>404</h1>
      <p>The agent looked everywhere. This page isn't part of the graph.</p>
      <a href="/MedAminePortfolio/">Back to the start</a>
    </main>
  </body>
</html>
