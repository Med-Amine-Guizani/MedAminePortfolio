    <!-- Static boot shell: paints before any JS runs, then React replaces it. -->
    <style>
      html, body { background: #0b0a0c; margin: 0; }
      .shell { position: fixed; inset: 0; display: grid; place-items: center; background: #070608; color: #9a948c; font: 13px ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .shell > div { width: min(560px, calc(100vw - 32px)); }
      .shell pre { margin: 0 0 28px; min-height: 9em; font: inherit; }
      .shell b { display: block; font: 200 clamp(64px, 12vw, 140px)/0.8 system-ui, sans-serif; letter-spacing: -0.04em; color: #f2ede6; }
    </style>
